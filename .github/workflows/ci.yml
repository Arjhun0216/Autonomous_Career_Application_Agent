name: Career Agent CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Spring Boot backend
        run: mvn -B -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: job-platform-frontend/package-lock.json
      - name: Build React frontend
        working-directory: job-platform-frontend
        run: |
          npm ci
          npm run build
