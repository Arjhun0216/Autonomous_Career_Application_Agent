spring.application.name=job-platform-backend
spring.profiles.default=local
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_platform?useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
recommendation.embedding-service.url=${EMBEDDING_SERVICE_URL:http://localhost:8001}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-3.5-flash-lite

gmail.oauth.client-id=${GOOGLE_CLIENT_ID}
gmail.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
gmail.oauth.redirect-uri=${GMAIL_OAUTH_REDIRECT_URI:http://localhost:8080/api/gmail/oauth2/callback}
gmail.oauth.scope=https://www.googleapis.com/auth/gmail.send
gmail.oauth.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
gmail.oauth.application-name=Job Platform

college.mailing.resume-path=${COLLEGE_MAILING_RESUME_PATH:uploads/Arjun_M_Resume.pdf}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
